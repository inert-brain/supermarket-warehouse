# PUBLIC writes are only appropriate for an isolated, single-phone prototype.
# Expiry is decided by the phone. There are no version tokens or retry ledger.
# Every failed check or activity insert rolls back the entire transaction.
mutation PlaceProduct($productID: String!, $targetSlotID: Int!)
@auth(
    level: PUBLIC
    insecureReason: "Unauthenticated writes are intentionally allowed for the isolated prototype."
)
@transaction {
    stock_updateMany(
        where: { productID: { eq: $productID }, currentStatus: { eq: EMPTY } }
        data: { currentStatus: OCCUPIED, statusUpdatedAt_expr: "request.time" }
    ) @check(expr: "this == 1", message: "STALE_STOCK")
    # The unique product-assignment index also rejects an existing binding.
    slot_updateMany(
        where: {
            slotId: { eq: $targetSlotID, ge: 1, le: 8 }
            productID: { isNull: true }
            assignedAt: { isNull: true }
        }
        data: { productID: $productID, assignedAt_expr: "request.time" }
    ) @check(expr: "this == 1", message: "STALE_TARGET")
    activity_insert(data: { productID: $productID, activityType: ON_RACK })
}

mutation TakeOffRack($productID: String!, $sourceSlotID: Int!)
@auth(
    level: PUBLIC
    insecureReason: "Unauthenticated writes are intentionally allowed for the isolated prototype."
)
@transaction {
    stock_updateMany(
        where: {
            productID: { eq: $productID }
            currentStatus: { eq: OCCUPIED }
        }
        data: {
            currentStatus: PENDING_DISPATCH
            statusUpdatedAt_expr: "request.time"
        }
    ) @check(expr: "this == 1", message: "STALE_STOCK")
    # A matching no-op update checks the reservation without changing assignedAt.
    source: slot_updateMany(
        where: {
            slotId: { eq: $sourceSlotID, ge: 1, le: 8 }
            productID: { eq: $productID }
            assignedAt: { isNull: false }
        }
        data: { productID: $productID }
    ) @check(expr: "this == 1", message: "STALE_SOURCE")
    activity_insert(data: { productID: $productID, activityType: OFF_RACK })
}

